<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f6fb"/>
      <stop offset="1" stop-color="#e9ebf7"/>
    </linearGradient>
  </defs>
  <rect width="1640" height="624" fill="url(#bg)"/>

  <!-- barras decorativas laterales (pueden recortarse en mobile) -->
  <g opacity="0.16">
    <rect x="80" y="384" width="52" height="160" rx="24" fill="#4338ca"/>
    <rect x="160" y="304" width="52" height="240" rx="24" fill="#f97316"/>
    <rect x="240" y="224" width="52" height="320" rx="24" fill="#4338ca"/>
  </g>
  <g opacity="0.16">
    <rect x="1348" y="384" width="52" height="160" rx="24" fill="#4338ca"/>
    <rect x="1428" y="304" width="52" height="240" rx="24" fill="#f97316"/>
    <rect x="1508" y="224" width="52" height="320" rx="24" fill="#4338ca"/>
  </g>

  <!-- bloque superior: el centro-abajo queda libre porque la foto de perfil circular se superpone ahí -->
  <g>
    <g transform="translate(682,64)">
      <rect x="0" y="44" width="24" height="56" rx="11" fill="#4338ca"/>
      <rect x="37" y="22" width="24" height="78" rx="11" fill="#f97316"/>
      <rect x="74" y="0" width="24" height="100" rx="11" fill="#4338ca"/>
    </g>
    <text x="822" y="150" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="96" font-weight="bold" fill="#1b1f3b" letter-spacing="-2">Sondea</text>
    <text x="820" y="248" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#4a4f6e">Encuestas online sobre los temas que importan</text>
    <text x="820" y="322" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#f97316">Tu opinión, medida en serio · sondea.org</text>
  </g>
</svg>
